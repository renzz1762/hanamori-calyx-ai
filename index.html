<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Percakapan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="phone" id="phone">

        <!-- BANNED OVERLAY -->
        <div class="banned-overlay" id="banned-overlay">
            <div class="ban-icon" id="ban-icon-slot"></div>
            <div class="ban-title">Akun Diblokir</div>
            <div class="ban-reason" id="ban-reason-text">Anda telah diblokir oleh Owner karena melanggar kebijakan.</div>
            <div class="ban-sub">Hubungi Owner untuk pembukaan blokir</div>
            <button class="primary-btn" id="request-unban-btn">Ajukan Buka Blokir</button>
            <button class="btn-ghost" id="ban-logout-btn" style="color:rgba(255,255,255,0.5);margin-top:12px;">Logout</button>
        </div>

        <!-- LOGIN SCREEN -->
        <div class="login-screen" id="login-screen">
            <div class="login-box">
                <h1>Chat App</h1>
                <div class="sub">Masuk atau daftar akun</div>
                <div class="login-tabs">
                    <div class="login-tab active" data-tab="login">Masuk</div>
                    <div class="login-tab" data-tab="register">Daftar</div>
                </div>
                <div id="login-error" class="login-error"></div>
                <div id="login-fields">
                    <div class="form-group">
                        <label>Username</label>
                        <input id="login-username" placeholder="Masukkan username" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input id="login-password" type="password" placeholder="Masukkan password" />
                    </div>
                </div>
                <div id="register-fields" style="display:none;">
                    <div class="form-group">
                        <label>Username</label>
                        <input id="register-username" placeholder="Pilih username" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input id="register-password" type="password" placeholder="Buat password" />
                    </div>
                    <div class="form-group">
                        <label>Nomor HP</label>
                        <input id="register-phone" placeholder="Masukkan nomor HP" />
                    </div>
                    <div class="form-group">
                        <label>Session ID</label>
                        <input id="register-session" placeholder="Session ID (opsional)" />
                    </div>
                </div>
                <button class="primary-btn" id="login-btn">Masuk</button>
            </div>
        </div>

        <div class="header">
            <div class="header-title" id="header-title">Percakapan</div>
            <div class="header-icons">
                <div class="icon-btn" id="camera-btn"></div>
                <div class="icon-btn" id="menu-btn"></div>
            </div>
        </div>

        <div class="content scrollbar-thin" id="main-content"></div>

        <div class="speed-dial" id="speed-dial"></div>
        <button class="fab" id="fab"></button>

        <div class="bottom-nav" id="bottom-nav">
            <div class="nav-item active" data-tab="chats">
                <div class="nav-icon"></div>
                <span>Chat</span>
            </div>
            <div class="nav-item" data-tab="status">
                <div class="nav-icon"></div>
                <span>Status</span>
            </div>
            <div class="nav-item" data-tab="komunitas">
                <div class="nav-icon"></div>
                <span>Komunitas</span>
            </div>
            <div class="nav-item" data-tab="pengaturan">
                <div class="nav-icon"></div>
                <span>Pengaturan</span>
            </div>
        </div>

        <div class="screen" id="chat-screen">
            <div class="chat-header">
                <div class="icon-btn" id="chat-back"></div>
                <div class="chat-header-info" id="chat-header-info">
                    <div id="chat-avatar-wrap"></div>
                    <div style="min-width:0;flex:1;">
                        <div class="chat-header-name" id="chat-name"></div>
                        <div class="chat-header-status" id="chat-status"></div>
                    </div>
                </div>
                <div class="chat-header-actions" id="chat-header-actions"></div>
            </div>
            <div class="content scrollbar-thin" id="messages" style="flex:1;"></div>
            <div class="help-quickbtn" id="help-quickbar" style="display:none;">
                <button class="primary-btn" id="quick-verify-btn">Ajukan Centang Biru untuk Akun Saya</button>
            </div>
            <div class="composer">
                <div class="icon-btn" id="emoji-btn"></div>
                <div class="icon-btn" id="clip-btn"></div>
                <input id="draft-input" placeholder="Ketik pesan" autocomplete="off" />
                <button id="send-btn"></button>
                <div class="icon-btn" id="mic-icon"></div>
            </div>
        </div>

        <div class="screen" id="info-screen">
            <div class="chat-header">
                <div class="icon-btn" id="info-back"></div>
                <div class="chat-header-name" style="flex:1;">Info</div>
            </div>
            <div class="content scrollbar-thin" id="info-content"></div>
        </div>

        <div class="screen" id="owner-screen">
            <div class="chat-header">
                <div class="icon-btn" id="owner-back"></div>
                <div class="chat-header-name" style="flex:1;">Panel Owner</div>
                <span class="owner-crown-badge" id="owner-panel-badge">OWNER</span>
            </div>
            <div class="content scrollbar-thin" id="owner-content"></div>
        </div>

        <div class="story-screen" id="story-screen">
            <div class="story-progress" id="story-progress"></div>
            <div class="story-top">
                <div id="story-avatar-wrap"></div>
                <div>
                    <div class="story-top-name" id="story-name"></div>
                    <div class="story-top-time" id="story-time"></div>
                </div>
                <div class="story-close" id="story-close"></div>
            </div>
            <div class="story-body" id="story-body"></div>
            <div id="story-controls" style="position:absolute;inset:0;pointer-events:none;"></div>
            <div class="story-nav" id="story-prev" style="left:0;"></div>
            <div class="story-nav" id="story-next" style="right:0;"></div>
        </div>

        <div class="modal-backdrop" id="modal-backdrop">
            <div class="modal-sheet" id="modal-sheet"></div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="main.js"></script>
</body>
</html>
